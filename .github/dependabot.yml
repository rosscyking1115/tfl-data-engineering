# Version updates. Security updates are switched on in the repository settings
# and do not depend on this file. Monthly and grouped, so each ecosystem opens
# at most one pull request a month.
version: 2
updates:
  - package-ecosystem: "pip"
    directories: ["/app", "/ml"]
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directories: ["/infra/airflow", "/ml"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
